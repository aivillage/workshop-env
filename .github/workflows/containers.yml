name: Build and Push Containers

on:
  push:
    branches: [main, 'feat/**']
    paths:
      - 'sidecar/**'
      - 'hub/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
  pull_request:
    branches: [main]
    paths:
      - 'sidecar/**'
      - 'hub/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
      - 'flake.nix'
      - 'flake.lock'
      - 'nix/**'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main
      - name: Run tests
        run: nix flake check

  build-and-push:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image:
          - name: workshop-sidecar
          - name: workshop-hub

    steps:
      - uses: actions/checkout@v4

      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push container via Nix
        run: nix run .#upload-${{ matrix.image.name }}